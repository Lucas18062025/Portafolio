name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # fetch-depth 0: el gate de T9 compara contra el ref base del PR, y
        # con profundidad 1 ese ref no esta en el clon.
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (if any)
        run: |
          if [ -f package.json ]; then npm ci; fi
      - name: Lint (if lint script exists)
        run: |
          if npm run | grep -q lint; then npm run lint; else echo "No lint script"; fi
      - name: Verify CSP header
        run: node scripts/verify-csp.js
      # Gate del PR: mismas barreras que el pre-flight local (scripts/guards.mjs),
      # contra la base del PR. Sin T4 (dry-run) porque aca no hay credenciales
      # de Cloudflare: esa se valida en deploy.yml, antes de desplegar.
      - name: Guards (T1-T3b, T9)
        if: github.event_name == 'pull_request'
        run: node scripts/guards.mjs --base "${{ github.event.pull_request.base.sha }}"
